[versions]
jdk = "21"
jre = "8"
checkstyle = "10.25.0"

[plugins]
gradle-publish = "com.gradle.plugin-publish:1.3.1"
git-publish = "org.ajoberstar.git-publish:5.1.1"
pages = "com.hanggrian.pages:0.2"

[libraries]
# lint
rulebook-checkstyle = "com.hanggrian.rulebook:rulebook-checkstyle:0.1"
# main
# test
junit = "junit:junit:4.13.2"
mockito-core = "org.mockito:mockito-core:5.18.0"
truth = "com.google.truth:truth:1.4.4"

[bundles]
junit4 = [
  "junit",
  "mockito-core",
  "truth",
]
